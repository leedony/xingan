function landing(){current=-1;document.title='无后 · 辛甘作品书架';$('#toc-toggle').classList.add('hidden');$('#read-progress').style.width='0';const resume=progress&&book.chapters.find(c=>c.id===progress.chapter);$('#book-root').innerHTML='<section class="cover"><div><span class="eyebrow">THE WRITTEN UNIVERSE / 辛甘作品书架</span><h1>无后</h1><p class="lede">腊月二十七的高铁，从苏州到唐山，六个钟头。</p><p class="meta">48 章 · 全文已上架 · v1</p><div class="cover-actions"><a class="primary" href="#'+book.chapters[0].id+'">从第一章开始 <span>→</span></a>'+(resume?'<button id="resume" class="subtle">继续上次阅读 ↗</button><p class="resume-state">上次读到：'+esc(resume.title)+'</p>':'<a class="subtle" href="#chapter-catalogue">查看章节目录 ↓</a>')+'</div></div><div class="book-object" aria-label="无后文字封面"><small>XINGAN / ORIGINAL WORK</small><strong>无后</strong><span>THE WRITTEN UNIVERSE</span></div></section><section class="catalogue" id="chapter-catalogue"><div class="catalogue-header"><h2>章节目录</h2><p>CONTENTS / 48 CHAPTERS</p></div><div class="catalogue-tools"><input id="book-search" type="search" aria-label="搜索章节或全文" placeholder="搜索章节标题，或在全文中寻找一句话…" maxlength="100"></div><div id="search-results" class="search-results" aria-live="polite" hidden></div><div class="chapter-grid">'+book.chapters.map((c,i)=>chapterLink(c,i).replace('<a ','<a class="chapter-link" ')).join('')+'</div></section><footer class="site-footer"><span>《无后》 · 辛甘作品书架</span><span>保留原文与章节标题 · 仅调整网页阅读排版</span></footer>';$('#resume')?.addEventListener('click',()=>{const saved={...progress};location.hash=saved.chapter;setTimeout(()=>restorePosition(saved),120)});$('#book-search').oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(e.target.value),180)}}
function search(q){q=q.trim();const out=$('#search-results');if(!q){out.hidden=true;document.querySelectorAll('.chapter-grid .chapter-link').forEach(a=>a.hidden=false);return}out.hidden=false;const matches=[];for(const c of book.chapters){if(c.title.includes(q))matches.push({c,p:-1,text:'章节标题匹配'});for(let i=0;i<c.paragraphs.length;i++){const s=c.paragraphs[i],pos=s.indexOf(q);if(pos>=0)matches.push({c,p:i,text:(pos>30?'…':'')+s.slice(Math.max(0,pos-30),pos+q.length+75)+(s.length>pos+q.length+75?'…':'')})}}out.innerHTML='<p class="resume-state">共找到 '+matches.length+' 处匹配'+(matches.length>80?'，先显示前 80 处':'')+'</p>'+matches.slice(0,80).map(m=>'<a class="search-result" href="#'+m.c.id+(m.p>=0?'/p-'+m.p:'')+'"><strong>'+esc(m.c.title)+'</strong><p>'+esc(m.text)+'</p></a>').join('');document.querySelectorAll('.chapter-grid .chapter-link').forEach(a=>a.hidden=!a.textContent.includes(q))}
function reader(index,pid){current=index;const c=book.chapters[index];document.title=c.title+' · 无后 · 辛甘';$('#toc-toggle').classList.remove('hidden');const charCount=c.paragraphs.join('').length;$('#book-root').innerHTML='<div class="reader-layout"><aside class="toc" id="toc" aria-label="章节目录"><div class="toc-head"><h2>无后</h2><button id="toc-home">作品首页 ↗</button></div><div class="toc-search"><input id="toc-search" type="search" aria-label="筛选章节目录" placeholder="寻找章节…"></div><nav class="toc-links">'+book.chapters.map((ch,i)=>chapterLink(ch,i,true)).join('')+'</nav></aside><section class="reader-main"><div class="reading-meta"><span>无后 / '+String(index+1).padStart(2,'0')+' OF 48</span><span>'+charCount.toLocaleString()+' 字符 · v1</span></div><h1 class="chapter-title" id="chapter-heading">'+esc(c.title)+'</h1><article class="prose" aria-labelledby="chapter-heading">'+c.paragraphs.map((p,i)=>'<p id="p-'+i+'">'+esc(p)+'</p>').join('')+'</article><nav class="chapter-navigation" aria-label="章节翻页">'+(index?'<a href="#'+book.chapters[index-1].id+'">← 上一章<strong>'+esc(book.chapters[index-1].title)+'</strong></a>':'<a class="disabled" aria-disabled="true">已经是第一章</a>')+'<a href="#contents">返回目录</a>'+(index<book.chapters.length-1?'<a href="#'+book.chapters[index+1].id+'">下一章 →<strong>'+esc(book.chapters[index+1].title)+'</strong></a>':'<a href="#contents">全书读完了<strong>回到作品首页 ↗</strong></a>')+'</nav><footer class="reader-foot"><span>《无后》 · 辛甘</span><span>阅读位置仅保存在当前浏览器</span></footer></section></div>';$('#toc-home').onclick=()=>location.hash='contents';$('#toc-search').oninput=e=>{document.querySelectorAll('.toc-links a').forEach(a=>a.hidden=!a.textContent.includes(e.target.value.trim()))};closeToc();restoring=true;window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(()=>{if(pid!==undefined)$('#p-'+pid)?.scrollIntoView({behavior:'instant',block:'start'});restoring=false;updateProgress()});$('#toc [aria-current=page]')?.scrollIntoView({block:'nearest',behavior:'instant'});}
function route(){if(!book)return;closeToc();const hash=decodeURIComponent(location.hash.slice(1));const m=hash.match(/^(chapter-\d{2})(?:\/p-(\d+))?$/);const idx=m?book.chapters.findIndex(c=>c.id===m[1]):-1;if(idx>=0)reader(idx,m[2]===undefined?undefined:Number(m[2]));else{landing();requestAnimationFrame(()=>{if(hash==='chapter-catalogue')$('#chapter-catalogue')?.scrollIntoView();else window.scrollTo({top:0,behavior:'instant'})})}}
